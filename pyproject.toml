[project]
name = "biomin-screen"
version = "1.0.0"
description = "Thermodynamic screening of biopolymer-templated carbonate and phosphate phases for coatings in lithium-ion cells."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pyyaml==6.0.3",
    "sympy==1.14.0",
    "pymatgen==2026.9.24",
    "monty==2026.7.16",
    "matplotlib==3.11.2",
    "cmcrameri==1.10",
    "colorspacious==1.1.2",
    "contourpy==1.4.0",
    "jsonschema==4.26.0",
    "pint==0.26.1",
    "pymupdf==1.28.2",
    "pillow==12.3.0",
]

[project.optional-dependencies]
refresh = ["mp-api==0.46.5", "emmet-core==0.87.3", "requests==2.34.2"]

[project.scripts]
biomin-screen = "biomin_screen.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.170.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomin_screen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
