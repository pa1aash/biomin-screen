# Gap-resolution table of the production screen.
#
# For every input the screen needs that has no sourced prior in data/params.yaml, exactly one specified
# treatment:
#
#   ignorance    a bounded ignorance prior whose bounds are the expressions of
#                data/ignorance_priors.md (or the same bound rule applied to a control surface,
#                stated where so); a probability computed under it is never a finding
#                (ignorance_priors.md section 3);
#   analog       a flagged analog prior: a table key with role analog (data/params.yaml), run beside the
#                result without it; every verdict that rests on it is labelled conditional on the
#                analog;
#   design_axis  a design axis over a specified grid (values are table points or specified
#                states, never literature numbers typed here); the verdict is reported per point;
#   unresolved   no admissible treatment exists: the test that needs the key reports "gap" and
#                counts as inconclusive (thresholds: a missing key makes its test a gap).
#
# No number is typed in this file: every value is a table key, a table point (min, value,
# max) or an expression of data/ignorance_priors.md. "beside" names the result each treatment is
# run beside. The prior sets of configs/screen.yaml select the treatments:
#   table      sourced priors only; every key below is then a gap (the side-by-side baseline);
#   ignorance  the ignorance, analog and design-axis treatments below.
version: 1
reporting:
  ignorance_is_finding: false            # ignorance_priors.md section 3.1
  admissibility_label: 'conditional on admissibility (M_adm printed beside)'
  analog_label: 'conditional on the flagged analog <key>'
  unresolved_counts_as: inconclusive
  flip_values: where each unresolved or ignorance-bounded input flips a verdict

# ---------------------------------------------------------------- R-slurry template inputs
gaps:
  gamma_sn0_template:
    symbol: gamma_sn0
    links: [C3, C4]
    treatment: ignorance
    prior: uniform
    low: '0'
    high: gamma_p + gamma_nv
    bound_from: data/ignorance_priors.md 1a (dry work of adhesion >= 0; interface stability)
    inputs: {gamma_p: gamma_p_pda, gamma_nv: {calcite: gamma_nv_calcite, ACC: gamma_nv_acc}}
    per_draw: true                       # the bound moves with the gamma_p and gamma_nv draws
    analog: none                         # no measured analog of gamma_sn exists
    beside: table set (C3 and C4 not evaluable)
  delta_gamma_w:
    symbol: Delta_gamma_w
    links: [C3, C4]
    treatment: ignorance
    value_rule: '0: the prior is placed on the total contact energy (data/ignorance_priors.md 1b)'
    beside: table set
  gamma_nv_acc:
    symbol: gamma_nv
    links: [C3, C4]
    framing: ACC
    treatment: analog
    analog: gamma_nv_acc_calcite_analog
    use: the upper bound gamma_p + gamma_nv of the ACC-framing gamma_sn ignorance prior
    reason: no ignorance bound on gamma_nv is specified; the flagged analog (calcite dry surface energy)
    beside: table set (ACC-framing C3 and C4 not evaluable)
  delta_g_site:
    symbol: Delta_G_site
    links: [C2, C3, C4]
    treatment: analog
    analog: log10_k_ca_catecholate
    conversion: 'Delta_G_site = -R_gas*T*(log(K_Ca_catecholate) + log(c_max/c_std)), c_max = Gamma_s/delta_s'
    conversion_function: Delta_G_site_from_K      # the same expression, specification v4 (site-volume standard state)
    cycle: {function: Delta_G_seq_cycle_2H, pKa: pka_catechol, pKa2: pka2_catechol,
            reason: 'thresholds C2.analog_route: the constant refers to the catecholate dianion, so both protons are charged'}
    conversion_reason: >-
      The analog is a solution complexation constant (standard concentration c_std, exact by
      definition) of Ca2+ with the deprotonated catecholate; Delta_G_site uses the site-volume
      standard state (data/symbols.yaml). With this conversion the Langmuir odds of the contract,
      x = E_enr c_bulk / c_max, reduce to x = K c_bulk / c_std divided by the deprotonation factor,
      the conditional binding constant of the analog.
    flags: [single_source, widened]      # carried from the key
    limitation: >-
      The second catechol proton (pka2_catechol) is charged through the specification v4 two-proton cycle.
    direction: >-
      thresholds C2.analog_route: lateral repulsion and site competition only lower the occupancy, so
      the Langmuir term at the solution affinity is an upper bound on the lowering with respect to
      those effects; site geometry moves the zero-coverage affinity either way
    reason: Delta_G_site is computed by the study's PMF, which P0 does not run (literature binding energies, flagged)
    beside: table set (C2, C3 and C4 not evaluable)
  delta_s:
    symbol: delta_s
    links: [C2, C3, C4]
    treatment: ignorance
    prior: loguniform                    # the bound spans more than a decade
    low: Gamma_s*V_m                     # the 2 r_Ca term is dropped while r_Ca is a gap (valid, looser)
    high: d_layer
    bound_from: data/ignorance_priors.md 4 and 4a.4
    inputs: {d_layer: template_layer_thickness, Gamma_s: gamma_s_site_density, V_m: {calcite: v_m_calcite, ACC: v_m_acc}}
    per_draw: true
    empty_interval: refused and counted (a draw with low >= high), never clipped (a bound from primary keys)
    sensitivity: 'max(2 r_Ca(analog), Gamma_s V_m) with r_Ca = ca_o_distance_aqueous_analog, labelled "tighter than the geometric bound" (4a.4)'
    beside: table set
  ca_ionic_radius:
    symbol: r_Ca
    links: [C2, C3, C4]
    treatment: unresolved                # the analog overstates r_Ca, so it is no valid bound
    effect: 'the 2 r_Ca term of the delta_s lower bound is dropped; the a_site bound 2 sqrt(3) r_Ca^2 is not formed'
    sensitivity: 'ca_o_distance_aqueous_analog in the delta_s lower bound and the a_site cap, labelled, flagged, never refusing'
  template_group_density:
    symbol: rho_L
    links: [C2, C3, C4]
    treatment: analog
    analog: template_group_density_site_analog
    use: 'the Gamma_s cap rho_L*d_layer evaluated with the analog: draws above it are flagged and their mass reported, never refused (analog bounds never refuse)'
    primary_bound: 'rho_L <= rho_PDA/M_u (4a.3): template_mass_per_group_min is absent, so the primary cap is a gap'
    beside: table set
  site_footprint_area:
    symbol: a_site
    links: [C2, C3, C4]
    treatment: unresolved
    effect: 'the 1/(N_A a_site) term of the Gamma_s bound is not applied; with a_site >= 2 sqrt(3) r_Ca^2 (4a.2) it needs r_Ca, a gap; the analog form is reported in the r_Ca sensitivity, flagged, never refusing'
  template_mass_per_group_min:
    symbol: M_u
    links: [C2, C3, C4]
    treatment: unresolved
    effect: 'absent key : the primary cap rho_L <= rho_PDA/M_u is not formed; no geometric cap on the sourced Gamma_s'
  asperity_contact_area:
    symbol: a_asp
    links: [C3]
    treatment: unresolved
    effect: 'absent key : the A_patch lower bound is not formed'
  cathode_particle_diameter:
    symbol: d_p
    links: [C3]
    treatment: unresolved
    effect: 'absent key : the A_patch upper bound pi d_p^2/4 is not formed'

  v_site:
    symbol: V_site
    links: [C2]
    treatment: ignorance
    value_rule: 'derived, V_site = delta_s/(N_A*Gamma_s) (data/ignorance_priors.md 4); not a chain input'
  termination_weights:
    symbol: termination_weights
    links: [C1]
    treatment: ignorance
    prior: flat Dirichlet on the simplex of the specified terminations (thresholds C1)
    mixture: 'W_mix = sum_k w_k W_k, w ~ Dirichlet(1, ..., 1), with the weight-free masses P(min_k W_k > m_W) and P(max_k W_k > m_W) beside '
    specified_terminations: none
    degenerate: >-
      No P0 input is resolved by termination (no PMF; the C1 analog and the Dupre energies carry no
      termination index) and the table specifies no termination list. Every termination therefore
      carries the same C1 prior: the per-termination verdicts equal the pooled verdict and the
      mixture equals it. Recorded, not compressed; the per-termination run needs the PMF study.

# ---------------------------------------------------------------- C1 (no PMF in P0)
  delta_f_pmf:
    symbol: Delta_F_pmf
    links: [C1]
    treatment: unresolved
    effect: 'C1 (decisive route W_adh_wet = Delta_F_pmf/A_c) reports gap and counts as inconclusive'
    beside: [C1_analog, C1_dupre]
  a_c:
    symbol: A_c
    links: [C1]
    treatment: unresolved
    effect: as delta_f_pmf
  gamma_ow_alumina:
    symbol: gamma_ow
    links: [C1_dupre, deletion bare_oxide]
    treatment: ignorance
    prior: uniform
    low: '0'
    high: gamma_o + gamma_w
    bound_from: data/ignorance_priors.md 1c
    inputs: {gamma_o: gamma_o_alumina, gamma_w: gamma_w}
    per_draw: true
  gamma_op:
    symbol: gamma_op
    links: [C1_dupre]
    treatment: ignorance
    prior: uniform
    low: '0'
    high: gamma_o + gamma_p
    bound_from: data/ignorance_priors.md 1c
    inputs: {gamma_o: gamma_o_alumina, gamma_p: gamma_p_pda}
    per_draw: true

  ca_total_slurry:
    symbol: Ca_T
    links: [C2, C3, C4, C5s]
    treatment: design_axis
    grid: 'configs/screen.yaml design_axes.Ca_T (one point per decade, read as the total dissolved Ca dose; gap policy (ii))'
    speciated: a_ca_slurry and c_bulk_slurry are computed per draw and printed beside each point
  dic_slurry_axis:
    symbol: C_T
    links: [C2, C3, C4, C5s]
    treatment: design_axis
    grid: {params: dic_slurry, at: [min, value, max]}
    note: 'dic_slurry is sourced; it is a design axis by the gap policy (ii), not a gap'
  n_req:
    symbol: N_req
    links: [C3]
    treatment: unresolved
    effect: 'derived from patch_area (gaps.patch_area) and p_cred; undetermined while patch_area is a gap'
# ---------------------------------------------------------------- C3, C4, states
  patch_area:
    symbol: A_patch
    links: [C3]
    treatment: unresolved
    effect: 'C3b (N_req = ln(1/(1 - p_cred))/A_patch) reports gap; C3 is decided by C3a only where C3a falsifies (a pass needs C3b); N_nuc is reported for the flip values A_F, A_X'
    bound: 'a_asp <= A_patch <= pi d_p^2/4, loguniform ; both keys absent '
  a_w_slurry:
    symbol: a_w
    links: [C3, C4, C5]
    state: drying
    treatment: design_axis
    grid:
      - {label: wet_film, value_from: 'the slurry state value a_w = 1 (by definition, configs/screen.yaml)'}
      - {label: dry_room_min, params: a_w_drying_secondary, at: min}
    reason: >-
      The primary drying film starts at the wet-slurry activity and dries toward the dry-room gas
      activity (the secondary drying key). a_w enters only the CaOH+ term of the speciation, which is
      monotone in a_w, so the two ends bracket the state. The bias of the drying states (optimistic) and
      the Omega_bulk_hydrated sensitivity are reported at both points.
    beside: the drying state missing, reported with the table set
  rho_e_caco3: {symbol: rho_e, links: [C4s], treatment: unresolved, effect: d_max not evaluable}
  phi_b_caco3: {symbol: phi_B, links: [C4s], treatment: unresolved, effect: d_max not evaluable}
  m_eff_tunnel: {symbol: m_eff, links: [C4s], treatment: unresolved, effect: d_max not evaluable}
  j_0_tunnel: {symbol: j_0, links: [C4s], treatment: unresolved, effect: d_max not evaluable}
  r_a_max: {symbol: R_A_max, links: [C4s], treatment: unresolved, effect: 'design input; d_max not evaluable'}
  j_req: {symbol: j_req, links: [C4s], treatment: unresolved, effect: 'design input; d_max not evaluable'}

# ---------------------------------------------------------------- C5
  e_cell_max:
    symbol: E_cell_max
    links: [C5c_ox]
    treatment: design_axis
    grid_by_class:                       # the cut-off is a property of the cathode class
      LFP: {params: e_cell_max_lfp, at: [min, value, max]}
      layered_NMC_NCA: {params: e_cell_max_layered, at: [min, value, max]}
      LCO: {params: e_cell_max_lco, at: [min, value, max]}
      LMO: {params: e_cell_max_lmo, at: [min, value, max]}
      LNMO: {params: e_cell_max_lnmo, at: [min, value, max]}
  solvation_ca_vs_li: {symbol: solvation, links: [C5c_ox], treatment: unresolved,
                       effect: 'solvated sink undetermined: no R-cell pass can count; the water analogs need gas-phase ion formation free energies to give an onset, so no analog onset exists'}
  solvation_al_vs_li: {symbol: solvation, links: [C5c_ox, C5c_red], treatment: unresolved, effect: as solvation_ca_vs_li}
  dfg_ca_clo4_2: {symbol: dfg, links: [C5c_ox], treatment: unresolved, effect: 'expt route uses exchange route through the tabulated enthalpy; its entropy bound is in window_margin_expt'}
  s_ca_clo4_2: {symbol: S, links: [C5c_ox], treatment: unresolved, effect: bounded by the analog entropies inside window_margin_expt}
  dfg_al_clo4_3: {symbol: dfg, links: [C5c_ox], treatment: unresolved, effect: Al phases with LiClO4 undetermined (never a pass)}
  dfg_al_no3_3: {symbol: dfg, links: [C5c_ox], treatment: unresolved, effect: not a specified sink}
  dfg_alcl3: {symbol: dfg, links: [C5c_ox], treatment: unresolved, effect: not a specified sink}
  dfg_gibbsite: {symbol: dfg, links: [C5c_ox], treatment: unresolved, effect: 'gibbsite is reported, not gated'}

# ---------------------------------------------------------------- link-level treatments
c1:
  decisive: {route: PMF, quantity: W_adh_wet, status: gap (delta_f_pmf, a_c unresolved)}
  side_by_side:                          # each evaluated with the C1 rule (edge m_W) and labelled; neither replaces the PMF route
    C1_analog:
      quantity: W_adh_wet
      treatment: analog
      analog: w_adh_wet_catechol_oxide_analog
      label: conditional on the flagged analog w_adh_wet_catechol_oxide_analog (catecholic films on mica, silica and copper oxide)
      support: 'positive only (a pull-off records only adhering contacts): it cannot represent W <= 0 and leans toward anchoring ' 
    C1_dupre:
      quantity: W_adh_wet_comparator
      expression: gamma_ow + gamma_pw - gamma_op (data/ignorance_priors.md 1c)
      treatment: ignorance
      inputs: {gamma_ow: gamma_ow ignorance, gamma_op: gamma_op ignorance, gamma_pw: gamma_sl0_template}
      gamma_pw: 'the same quantity as gamma_sl0 (ignorance_priors.md 1d), with its truncation; the consistency bound gamma_pw <= gamma_p + gamma_w is reported'
      flip: 'gamma_op* = gamma_ow + gamma_pw - m_W (ignorance_priors.md 1c), '
      label: ignorance (never a finding)
admissibility:                           # (thresholds decision.admissibility; ignorance_priors.md 2a)
  condition: 'gamma_sl_insitu = gamma_sl0 + Delta_gamma_ads >= 0'
  joint_over: [gamma_sl0, Delta_G_seq, Gamma_s, delta_s]
  at: >-
    every specified R-slurry state (slurry, drying) at each design point: the states share their
    draws (common random numbers), and a draw is admitted only if the condition holds at every state
  draws_outside: refused and counted (never clipped, never floored at zero)
  retained_mass: 'M_adm = admitted / evaluable draws, per design point (joint over the states) and per state; never renormalised silently'
  verdicts: 'C3, C4 and the deletion test on the admitted draws, labelled conditional on admissibility'
  inadmissible_inputs: '1 - M_adm >= p_cred (the p_cred of the run, so it moves with the p_cred sweep): the link verdict is inconclusive, labelled inadmissible inputs, with the restricted verdict beside'
  report: [M_adm, 'P(gamma_sl_floor >= 0) (gamma_sl_floor = gamma_sl0 where Delta_G_seq >= 0: such a template lowers nothing)',
           r_ads quantiles over the admitted draws, unrestricted verdicts on the same draws, verdicts that differ]
  in_situ_supply: 'a surface supplied at the regime activities (the bare_oxide control, gamma_sl ~ U[0, gamma_o + gamma_w]) is admissible on every draw by its bound; M_adm = 1 is printed, not assumed'
  c2: 'C2 is a descriptor that does not use gamma_sl; it stays on the joint prior as specified, and its quantities over the admitted draws are printed beside'
  c1: 'C1 does not use gamma_sl (the Dupre estimate uses gamma_pw = gamma_sl0, truncated at 0 as specified); unchanged'
  sensitivity: >-
    the nucleate link (C3, C4 quantities) is analysed on the admitted draws at its state: a refused draw has no
    output (NaN), so the Shapley double loop samples the restricted conditionals by rejection and treats the
    dependence the restriction induces; the Sobol indices of independent marginals over the
    admitted draws are approximate under that dependence and labelled so; the ranking reads the Shapley effects
  sizing: 'M_adm is sized on the evaluable draws, the restricted masses on the admitted draws; unsized where the inputs are inadmissible'
c4:
  closure_route: 'C4s reports gap (d_max); C4 cannot be falsified (a falsification needs both routes) and passes only through S_spread'
  report: [P(gamma_sl > gamma_nl) per state, N_nuc]
c5:
  slurry_dissolution: {decided_by: Omega_bulk, inputs: sourced, design_axes: [Ca_T, C_T], al_axis: none (no Al in the speciation)}
  slurry_phase: {source: 'results/pourbaix/c5/slurry/<aCa>_<CT>_<Al>.json', design_axes: [Ca_T, C_T, Al_T]}
  cell: {source: 'results/pourbaix/c5/cell/<sink>.json', sinks: [LiClO4, LiBOB, LiPCP, solvated]}
  margin_mapping:                        # one margin per reaction and sink
    expt: {key: thresholds.C5.window_margin_expt, applies_to: [{phase: CaCO3, sink: LiClO4, side: oxidation}]}
    dft_where_expt_missing: {key: thresholds.C5.window_margin, applies_to: [{phase: CaCO3, sink: LiClO4, side: oxidation}]}
    comparators: no margin (printed with their benchmark errors)
    other_limits: 'undetermined: every other (phase, sink, side), the reduction limits included, has no budget key (never a pass, never a falsification)'

# ---------------------------------------------------------------- deletion-test controls
controls:
  bare_oxide:
    replaces: 'the template (thresholds, deletion test)'
    links: [C3, C4]
    gamma_sl:
      symbol: gamma_sl
      mode: in_situ                      # the energy at the regime activities; no Delta_gamma_ads is added
      treatment: ignorance
      prior: uniform
      low: '0'
      high: gamma_o + gamma_w
      bound_from: data/ignorance_priors.md 1c (gamma_ow)
      inputs: {gamma_o: gamma_o_alumina, gamma_w: gamma_w}
    gamma_sn:
      symbol: gamma_sn0
      treatment: ignorance
      prior: uniform
      low: '0'
      high: gamma_o + gamma_nv
      bound_from: 'the bound rule of data/ignorance_priors.md 1a (dry work of adhesion >= 0, interface stability) applied to the oxide-nucleus contact'
      inputs: {gamma_o: gamma_o_alumina, gamma_nv: {calcite: gamma_nv_calcite, ACC: gamma_nv_acc_calcite_analog}}
    Delta_gamma_w: '0 (prior on the total, ignorance_priors.md 1b)'
    c2_descriptors: {treatment: unresolved, effect: 'no Ca2+-oxide binding input; reported as gap (C2 is not a deletion link)'}
    c1: 'W_adh_wet = 0 by construction; C1 alone does not count'
    shared: [J0_het, t_proc, framing inputs, speciation inputs, design axes, states]
  PVDF:
    replaces: the template
    links: [C3, C4]
    gamma_c_dry: {treatment: unresolved, effect: 'no PVDF dry surface energy key: no ignorance bound can be formed'}
    effect: 'the PVDF control is not evaluable: the deletion test cannot hold, so the study cannot be feasible (thresholds, deletion test)'
  catechol_only: {gating: false, treatment: unresolved, effect: no inputs; not run}
  chitosan_only: {gating: false, treatment: unresolved, effect: no inputs; not run}
  carboxylate_substituted: {gating: false, treatment: unresolved, effect: no inputs; not run}
  under_ignorance: 'a deletion test whose template and control rest on ignorance priors compares prior widths; it is reported, never a finding'

# ---------------------------------------------------------------- sweeps and sensitivities (data/thresholds.md conventions)
sweeps:
  p_cred: [0.6, 0.9, 0.99]               # p_deg = 1 - p_cred moves with it
  m_cos: [0, 0.1, 0.2]
  gamma_sl0: [truncated, untruncated]    # the removed mass is reported
  dependence: [stated correlations, independent]
  acc_omega_margin: C5s_ACC per design point (Omega_bulk with the ACC K_sp, labelled, never gating)
sizing:
  band_mass_half_width_max: 0.01
  sobol_total_order_half_width_max: 0.02
  draws: doubled from 2**14 per state until the band-mass rule holds, capped at 2**20 per state
  wall_clock_cap: 6 h per run
  on_cap: capped, with the half-widths reached

# ---------------------------------------------------------------- not gaps, recorded for completeness
binding_corrections:                     # a binding of configs/screen.yaml named a key the table spells otherwise
  A_DH: {previous_name: davies_a, now: debye_huckel_a, reason: 'table key (params.debye_huckel_A); sourced, so no treatment is needed'}
  pKa2: {key: pka2_catechol, table_symbol: pKa, reason: 'the table records the second dissociation constant under pKa; specification v4 names it pKa2 (sourced, no treatment needed)'}
  corundum: {pourbaix_window: Al2O3, reason: 'window name for mp-1143'}
  boehmite: {pourbaix_window: none, treatment: unresolved, effect: 'undetermined, never a pass'}
not_screen_inputs:                       # gap or computed keys of the table that no screen link reads
  nucleation_density: 'N_s = N_nuc by the C4 rule (thresholds C4s); the key is not read'
  a_h_cell: 'the R-cell limits are deterministic Pourbaix windows; the activity is a Pourbaix input'
  a_co3_cell: as a_h_cell
  gamma_sn_ignorance_calcite: 'the table record of the gamma_sn ignorance prior (gaps.gamma_sn0_template draws it per draw)'
  gamma_sn_ignorance_acc: as gamma_sn_ignorance_calcite (its gamma_nv is the analog, gaps.gamma_nv_acc)
  gamma_sn_ignorance_acc_analog: as gamma_sn_ignorance_acc
  gamma_ow_ignorance: 'the table record of the gamma_ow ignorance prior (gaps.gamma_ow_alumina)'
  gamma_op_ignorance: 'the table record of the gamma_op ignorance prior (gaps.gamma_op)'
  gamma_s_geometric_bound_analog: 'the table record of rho_L d_layer with the analog density (gaps.template_group_density)'
  contact_area_definition: 'used only by the PMF route of C1, which is unresolved'
computed_or_specified:                  # keys of the table with no prior because the screen or the Pourbaix package computes them, or a specification sets them
  a_co3_slurry: computed per draw by the specification v3 speciation
  a_ca_slurry: computed per draw by the speciation (printed beside the Ca_T grid)
  c_bulk_slurry: computed per draw by the speciation (free Ca2+)
  a_ca_cell: Pourbaix R-cell input
  d_film: not read by the screen (the thickness enters C4s only through d_max)
  g_phase_database: Pourbaix input
  mu_li0: Pourbaix R-cell input
  delta_g_r: Pourbaix R-cell input
  mu_h2o: Pourbaix input
  framing: 'specified both : calcite and ACC, each run as a whole chain'
  gas_reference_schemes: 'specified : expt governs, janaf and mp comparators'
  al_phases: 'specified : corundum and boehmite gated'
  electrolyte_salts: 'categorical specification (fluorine-free salts): the R-cell sinks of the Pourbaix documents'
  electrolyte_solvents: 'categorical specification: Pourbaix R-cell input'
