outstanding:
  min_font_size_general:
    sought: a minimum text size for text inside figures (not structure labels)
    searched: [S1 Figures, graphics and images; S1 Chemical structures; S2 all 9 pages; S3 styles.xml]
    result: not stated. S1 gives 7 pt only for structure captions and atom labels; S3's 7 pt styles
      are paragraph styles for the caption and the figure holder in a Word manuscript, not artwork text.
  font_family_general:
    sought: a typeface for figure text in general
    searched: [S1, S2, S3]
    result: not stated; only Arial/Helvetica for structure labels (S1).
  line_weight_general:
    sought: minimum or recommended line weights for plots and line art
    searched: [S1, S2, S3]
    result: not stated; only bond widths for chemical structures (S1).
  colour_mode:
    sought: RGB or CMYK requirement
    searched: [S1, S2, S3]
    result: not stated.
  resolution_by_artwork_type:
    sought: separate resolutions for line art, halftone and combination artwork
    searched: [S1, S2]
    result: one figure of 600 dpi for all artwork.
  panel_label_convention:
    sought: case, weight and placement of panel letters
    searched: [S1, S2, S3]
    result: not stated.
  min_height:
    sought: a minimum figure height
    searched: [S1]
    result: not stated (only a maximum).

applied:
  width_single_in:
    value: 3.2677
    unit: in
    from: values.width_single_column
    rule: 8.3 cm / 2.54, rounded to 4 decimals
  width_double_in:
    value: 6.7323
    unit: in
    from: values.width_double_column
    rule: 17.1 cm / 2.54, rounded to 4 decimals
  max_height_in:
    value: 9.1732
    unit: in
    from: values.max_height
    rule: 23.3 cm / 2.54, rounded to 4 decimals
  raster_dpi:
    value: 600
    unit: dpi
    from: values.raster_resolution_min
    rule: the stated minimum, used as the raster resolution of every PNG export
  font_family:
    value: Helvetica
    fallbacks: [Liberation Sans, DejaVu Sans]
    from: values.structure_label_font
    rule: the specification names Arial or Helvetica for structure labels and nothing for other figure text;
      all figure text and mathtext use one sans-serif face
    fallback_rule: The figure font is the first of value, then fallbacks, that is installed, chosen
      explicitly (biomin_screen.figures.style.font) and printed by the build. Helvetica is one of the two
      faces the specification names; Liberation Sans is its metric-compatible substitute on Linux
      (fonts-liberation); DejaVu Sans ships with matplotlib and is always present. Arial is not required.
      The face changes glyph shapes and label widths, not the plotted numbers, so the check compares the
      numeric sidecars and not the image files.
  font_size:
    value: 7
    unit: pt
    from: values.structure_label_font_size
    rule: the only stated artwork text size, used for every text element (tick labels, axis titles,
      colour-bar labels, panel letters); it is also the figure checker's minimum
    corroborated_by: [values.caption_style_font_size]
  line_width_min:
    value: 0.5
    unit: pt
    from: values.structure_bond_width
    rule: the stated plain bond width, used for spines, ticks, error bars, contour lines and patch
      edges; it is also the figure checker's minimum
  line_width_data:
    value: 1.0
    unit: pt
    from: values.structure_bond_width
    rule: 2 x the plain bond width, for data lines; stays below the bold bond width (1.6 pt)
  marker_size:
    value: 3.2
    unit: pt
    from: values.structure_bold_bond_width
    rule: 2 x the bold bond width, so a marker is at least as wide as two bold strokes
  tick_length:
    value: 3.2
    unit: pt
    house: true
    reason: equal to applied.marker_size so ticks read at the same scale as markers; minor ticks are half
  errorbar_capsize:
    value: 0
    unit: pt
    house: true
    reason: caps are strokes that carry no data
  contour_linestyle:
    value: solid
    house: true
    reason: one line style for every contour level; levels are identified in the caption
  vector_format:
    value: pdf
    from: values.formats_accepted
    rule: PDF is an accepted vector format; line art is exported as PDF with TrueType (Type 42) fonts embedded
  raster_format:
    value: png
    house: true
    reason: lossless raster for viewing; the journal's TIFF supply (values.format_supplied) is made from the PDF
  tick_direction:
    value: out
    house: true
    reason: the plot area is kept for data only; outward ticks keep tick marks off the data
  spines_top_right:
    value: false
    house: true
    reason: fewer non-data strokes; the remaining two spines carry the scales
  grid:
    value: false
    house: true
    reason: nothing but data inside the plot area
  legend:
    value: false
    house: true
    reason: keys go in captions; the checker also rejects any legend
  layout:
    value: constrained
    house: true
    reason: keeps tick labels, axis titles, colour bars and panel letters inside the fixed column width
  panel_letter:
    value: {case: lower, weight: bold, placement: above the axes, left-aligned with the axes edge}
    house: true
    reason: the RSC convention is outstanding (panel_label_convention); lower-case bold is a design
      choice, to be revisited if a source states otherwise
  text_colour:
    value: '#000000'
    house: true
    reason: black text and strokes for maximum contrast (values.legibility)
