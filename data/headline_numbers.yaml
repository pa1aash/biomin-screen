# Headline quantities of the paper. `python scripts/numbers.py` reads each from the file named by `source`
# (`key` is a path into a JSON or YAML file; `pattern` is a regular expression over a text file) and prints it
# with `format`. Most sources are the tables in results/tables/, written by `make tables`.
numbers:
- id: carbonate_crossover
  source: results/pourbaix/ladder/ladder.csv
  pattern: ^CaCO3,crystalline,control,ALL,.*?falsified above ([0-9.]+) V
  format: .2f
  unit: V
- id: onset_bone_low
  source: results/pourbaix/ladder/ladder.csv
  pattern: ^a-TCP,crystalline,slurry,ALL,[^,]*,([0-9.]+),
  format: .2f
  unit: V
- id: onset_bone_high
